[package]
name = "ares-medops-playbooks"
version = "0.1.0"
edition = "2024"
description = "ARES-Health Phase 3 (ACT): deterministic MedOps Playbooks #01-#05 and the 3 Hard Clinical Safety Gates"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

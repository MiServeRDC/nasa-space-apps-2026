<!doctype html>
<html
  lang="en"
  class="dark bg-black text-[#F4F4F6]"
  data-boot-mode="choreographed"
  data-fonts-ready="pending"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:* ws://localhost:* http://localhost:* ipc: http://ipc.localhost; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:;"
    />
    <title>ARES-Health // Autonomous Deep-Space Biomedical Workbench</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        var doc = document.documentElement;
        try {
          var q = new URLSearchParams(window.location.search);
          var seen =
            sessionStorage.getItem('ares_intro_seen') === '1' ||
            sessionStorage.getItem('ares_boot_seen') === '1';
          var skip = q.get('skipIntro') === '1' || seen;
          var redMotion =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var redTrans =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-reduced-transparency: reduce)').matches;
          doc.setAttribute('data-boot-mode', skip || redMotion ? 'instant' : 'choreographed');
          if (redMotion) doc.classList.add('reduce-motion');
          if (redTrans) doc.classList.add('reduce-transparency');
        } catch (_) {
          doc.setAttribute('data-boot-mode', 'instant');
        }

        // Risk 1 Mitigation: Do NOT hold FCP. Critical #000000 shell paints immediately
        // on metric-matched fallback fonts (< 300ms), while GSAP Flip / character-decode
        // motion gates on document.fonts.ready with a bounded 900ms timeout fallback.
        function markFontsReady(status) {
          if (doc.getAttribute('data-fonts-ready') !== 'pending') return status;
          doc.setAttribute('data-fonts-ready', status);
          try {
            window.dispatchEvent(new CustomEvent('ares:fonts-ready', { detail: { status: status } }));
          } catch (_) {}
          return status;
        }

        if (document.fonts && typeof document.fonts.load === 'function') {
          var fontLockPromise = Promise.all([
            document.fonts.load('1rem "Geist Variable"'),
            document.fonts.load('1rem "Geist Mono Variable"'),
            document.fonts.ready,
          ]).then(
            function () {
              return markFontsReady('locked');
            },
            function () {
              return markFontsReady('timeout_fallback');
            }
          );
          var boundedTimeout = new Promise(function (resolve) {
            setTimeout(function () {
              resolve(markFontsReady('timeout_fallback'));
            }, 900);
          });
          window.__ARES_FONTS_READY__ = Promise.race([fontLockPromise, boundedTimeout]);
        } else {
          markFontsReady('locked');
          window.__ARES_FONTS_READY__ = Promise.resolve('locked');
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100dvh;
        background-color: #000000;
        color: #f4f4f6;
      }
      .sr-only-live {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .preboot-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: #000000;
      }
      .preboot-horizon {
        height: 36px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background-color: #000000;
        color: #f4f4f6;
        font: 600 11px/1 'Geist Mono Variable', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .preboot-horizon-muted {
        color: #9296a0;
      }
      .preboot-grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(288px, 320px) minmax(0, 1fr) minmax(320px, 368px);
        gap: 14px;
        padding: 14px;
        box-sizing: border-box;
      }
      .preboot-dock {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }
      .preboot-slot {
        flex: 1;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background-color: #0a0a0a;
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.14);
      }
      .preboot-stage {
        border-radius: 14px;
        background-color: #000000;
      }
      @media (max-width: 1024px) {
        .preboot-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- Persistent WAI-ARIA Live Regions mounted outside #root so React never unmounts them -->
    <div
      id="aria-polite-node"
      class="sr-only-live"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div
      id="aria-assertive-node"
      class="sr-only-live"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    ></div>

    <div id="root">
      <div class="preboot-shell">
        <header class="preboot-horizon" role="banner" aria-label="ARES-Health Horizon Telemetry Bar">
          <span>ARES-HEALTH // EDGE MEDOPS</span>
          <span>GATHER  /  EVALUATE  /  ACT</span>
          <span class="preboot-horizon-muted">AIR-GAPPED LOOPBACK</span>
        </header>
        <main class="preboot-grid" role="main" aria-label="ARES-Health Spatial Workbench">
          <aside class="preboot-dock" aria-label="Primary Vitals and Anomaly Dock">
            <div class="preboot-slot"></div>
            <div class="preboot-slot"></div>
          </aside>
          <section class="preboot-stage" aria-label="3D Anatomical Digital Twin Stage"></section>
          <aside class="preboot-dock" aria-label="Contextual Clinical Diagnostics and Playbook Dock">
            <div class="preboot-slot"></div>
          </aside>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

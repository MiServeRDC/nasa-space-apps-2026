services:
  app:
    build:
      context: ../..
      dockerfile: deploy/judges/Dockerfile
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    restart: unless-stopped

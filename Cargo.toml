[workspace]
resolver = "2"
exclude = ["vendor/lancedb"]
members = [
    "crates/ares-core-types",
    "crates/ares-telemetry-ingest",
    "crates/ares-causal-graph",
    "crates/ares-nqs-stl",
    "crates/ares-medops-playbooks",
    "crates/ares-security-privacy",
    "crates/ares-server-cli",
    "crates/ares-desktop-os",
    "crates/ares-storage-lsah",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Preserve embedded-only builds until upstream gates typed-job HTTP errors.
# Source checksum and the complete two-arm patch: docs/dependencies/LANCEDB_LOCAL_PATCH.md.
[patch.crates-io]
lancedb = { path = "vendor/lancedb" }
